trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

variables:
  PNPM_VERSION: "10.11.0"
  NODE_VERSION: "22"
  TURBO_CACHE_DIR: "$(Pipeline.Workspace)/.turbo"

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: CI
    displayName: "Lint, Typecheck & Test"
    jobs:
      - job: install_and_check
        displayName: "Install, Lint, Typecheck, Test"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "$(NODE_VERSION)"
            displayName: "Use Node.js $(NODE_VERSION)"

          - script: |
              corepack enable
              corepack prepare pnpm@$(PNPM_VERSION) --activate
              pnpm --version
            displayName: "Enable pnpm via Corepack"

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: "$(Pipeline.Workspace)/.pnpm-store"
            displayName: "Cache pnpm store"

          - script: |
              pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              pnpm install --frozen-lockfile
            displayName: "Install dependencies"

          - task: Cache@2
            inputs:
              key: 'turbo | "$(Agent.OS)" | turbo.json | pnpm-lock.yaml'
              restoreKeys: |
                turbo | "$(Agent.OS)"
              path: "$(TURBO_CACHE_DIR)"
            displayName: "Cache Turbo artifacts"

          - script: TURBO_CACHE_DIR=$(TURBO_CACHE_DIR) pnpm lint:check
            displayName: "Lint (turbo)"

          - script: TURBO_CACHE_DIR=$(TURBO_CACHE_DIR) pnpm typecheck
            displayName: "Typecheck (turbo)"

          - script: TURBO_CACHE_DIR=$(TURBO_CACHE_DIR) pnpm test
            displayName: "Test (turbo)"

  - stage: Build
    displayName: "Build All Apps"
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: build_all
        displayName: "Build"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "$(NODE_VERSION)"
            displayName: "Use Node.js $(NODE_VERSION)"

          - script: |
              corepack enable
              corepack prepare pnpm@$(PNPM_VERSION) --activate
            displayName: "Enable pnpm via Corepack"

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: "$(Pipeline.Workspace)/.pnpm-store"
            displayName: "Restore pnpm cache"

          - script: |
              pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              pnpm install --frozen-lockfile
            displayName: "Install dependencies"

          - task: Cache@2
            inputs:
              key: 'turbo | "$(Agent.OS)" | turbo.json | pnpm-lock.yaml'
              restoreKeys: |
                turbo | "$(Agent.OS)"
              path: "$(TURBO_CACHE_DIR)"
            displayName: "Restore Turbo cache"

          - script: TURBO_CACHE_DIR=$(TURBO_CACHE_DIR) pnpm build
            displayName: "Build all workspaces (turbo)"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "apps/api/dist"
              artifact: "api-dist"
            displayName: "Publish API build artifact"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "apps/nuxt/.output"
              artifact: "nuxt-output"
            displayName: "Publish Nuxt build artifact"
